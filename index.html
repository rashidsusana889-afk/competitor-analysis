<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>竞品分析报告触发器 | Competitor Analysis Trigger</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --success: #16a34a;
            --error: #dc2626;
            --warning: #d97706;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            width: 100%;
            max-width: 560px;
        }
        
        .card {
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
            padding: 40px;
        }
        
        .header {
            text-align: center;
            margin-bottom: 32px;
        }
        
        .header h1 {
            font-size: 24px;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 8px;
        }
        
        .header p {
            color: var(--text-muted);
            font-size: 14px;
        }
        
        .form-group {
            margin-bottom: 24px;
        }
        
        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: var(--text);
            margin-bottom: 8px;
        }
        
        .form-group input[type="text"],
        .form-group input[type="month"],
        .form-group select {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 14px;
            color: var(--text);
            background: var(--card-bg);
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        
        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }
        
        .form-group .hint {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 6px;
        }
        
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .checkbox-group input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: var(--primary);
        }
        
        .checkbox-group label {
            font-size: 14px;
            color: var(--text);
            cursor: pointer;
        }
        
        .btn {
            width: 100%;
            padding: 14px 24px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        
        .btn:hover:not(:disabled) {
            background: var(--primary-hover);
        }
        
        .btn:active:not(:disabled) {
            transform: scale(0.98);
        }
        
        .btn:disabled {
            background: #94a3b8;
            cursor: not-allowed;
        }
        
        .btn.loading {
            pointer-events: none;
        }
        
        .status {
            margin-top: 24px;
            padding: 16px;
            border-radius: 8px;
            display: none;
        }
        
        .status.show {
            display: block;
        }
        
        .status.success {
            background: #dcfce7;
            color: #166534;
            border: 1px solid #bbf7d0;
        }
        
        .status.error {
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #fecaca;
        }
        
        .status.info {
            background: #dbeafe;
            color: #1e40af;
            border: 1px solid #bfdbfe;
        }
        
        .status-icon {
            font-size: 18px;
            margin-right: 8px;
        }
        
        .info-box {
            margin-top: 24px;
            padding: 16px;
            background: #f1f5f9;
            border-radius: 8px;
            font-size: 13px;
            color: var(--text-muted);
        }
        
        .info-box h4 {
            font-size: 14px;
            font-weight: 500;
            color: var(--text);
            margin-bottom: 8px;
        }
        
        .info-box code {
            background: #e2e8f0;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'Monaco', 'Menlo', monospace;
            font-size: 12px;
        }
        
        .footer {
            text-align: center;
            margin-top: 24px;
            font-size: 12px;
            color: var(--text-muted);
        }
        
        .footer a {
            color: var(--primary);
            text-decoration: none;
        }
        
        .footer a:hover {
            text-decoration: underline;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .spinner {
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: none;
        }
        
        .loading .spinner {
            display: block;
        }
        
        .loading .btn-text {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="header">
                <h1>📊 竞品分析报告触发器</h1>
                <p>手动触发竞品分析报告生成任务</p>
            </div>
            
            <form id="triggerForm">
                <div class="form-group">
                    <label for="month">目标月份</label>
                    <input type="month" id="month" name="month" required>
                    <p class="hint">选择需要生成报告的月份</p>
                </div>
                
                <div class="form-group">
                    <label for="competitors">竞品列表</label>
                    <input type="text" id="competitors" name="competitors" 
                           value="Keep,Strava,Garmin Connect,Zwift,MyWhoosh,iGPSPORT,行者,Rouvy">
                    <p class="hint">多个竞品用逗号分隔</p>
                </div>
                
                <div class="form-group">
                    <div class="checkbox-group">
                        <input type="checkbox" id="aiAnalysis" name="aiAnalysis" checked>
                        <label for="aiAnalysis">启用 AI 智能分析 (GPT-4)</label>
                    </div>
                </div>
                
                <button type="submit" class="btn" id="submitBtn">
                    <span class="btn-text">🚀 触发生成报告</span>
                    <span class="spinner"></span>
                </button>
            </form>
            
            <div class="status" id="status"></div>
            
            <div class="info-box">
                <h4>💡 使用说明</h4>
                <p>1. 选择目标月份</p>
                <p>2. 可自定义竞品列表</p>
                <p>3. 点击触发按钮</p>
                <p>4. 前往 <a href="https://github.com/features/actions" target="_blank">GitHub Actions</a> 查看执行进度</p>
                <p style="margin-top: 8px;">GitHub Token 需要配置在仓库 Secrets 中: <code>GITHUB_TOKEN</code></p>
            </div>
            
            <div class="footer">
                <p>Powered by <a href="https://github.com/features/actions" target="_blank">GitHub Actions</a></p>
            </div>
        </div>
    </div>

    <script>
        // 设置默认月份为当前月份
        const now = new Date();
        const defaultMonth = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
        document.getElementById('month').value = defaultMonth;
        
        // 表单提交处理
        document.getElementById('triggerForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const btn = document.getElementById('submitBtn');
            const status = document.getElementById('status');
            const month = document.getElementById('month').value;
            const competitors = document.getElementById('competitors').value;
            const aiAnalysis = document.getElementById('aiAnalysis').checked;
            
            // 显示加载状态
            btn.classList.add('loading');
            btn.disabled = true;
            status.classList.remove('show');
            
            // GitHub 配置
            const GITHUB_OWNER = '{{GITHUB_OWNER}}';  // 替换为你的 GitHub 用户名
            const GITHUB_REPO = '{{GITHUB_REPO}}';    // 替换为你的仓库名
            const GITHUB_TOKEN = '{{GITHUB_TOKEN}}';   // 替换为你的 GitHub Token
            
            try {
                const response = await fetch(
                    `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/dispatches`,
                    {
                        method: 'POST',
                        headers: {
                            'Authorization': `Bearer ${GITHUB_TOKEN}`,
                            'Accept': 'application/vnd.github+json',
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            event_type: 'manual-report-trigger',
                            client_payload: {
                                month: month,
                                competitors: competitors,
                                ai_analysis: aiAnalysis
                            }
                        })
                    }
                );
                
                if (response.ok || response.status === 204) {
                    status.innerHTML = '<span class="status-icon">✅</span>报告生成已触发！请前往 <a href="https://github.com/' + GITHUB_OWNER + '/' + GITHUB_REPO + '/actions" target="_blank">GitHub Actions</a> 查看进度。';
                    status.className = 'status show success';
                } else {
                    const errorData = await response.json();
                    throw new Error(errorData.message || '触发失败');
                }
            } catch (error) {
                status.innerHTML = '<span class="status-icon">❌</span>触发失败: ' + error.message + '<br><br>请确保已正确配置 GitHub Token 和仓库信息。';
                status.className = 'status show error';
            } finally {
                btn.classList.remove('loading');
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
